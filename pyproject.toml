[project]
name = "eye-state-detector"
version = "0.1.0"
description = "睁眼 / 闭眼检测"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["eye", "blink", "drowsiness", "mediapipe", "ear", "computer-vision"]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Developers", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Topic :: Scientific/Engineering :: Image Recognition"]
dependencies = ["mediapipe>=0.10.9", "numpy>=1.24", "opencv-python>=4.8"]

[project.optional-dependencies]
validate = ["huggingface-hub>=0.20", "pillow>=10"]
dev = ["pytest>=8"]


[project.scripts]
eye-state = "eye_state.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eye_state"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["smoke: 需要模型文件的端到端用例"]

[tool.uv]
package = true
